<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車況透視鏡</title>
<meta name="description" content="2026 和泰 AI 黑客松參賽作品：車況透視鏡 — 以 LINE 串聯回廠前、中、後的車況、報價、進度與完工資訊（概念驗證原型，示意資料）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   車況透視鏡 — 樣式
   主軸：車主端（LINE 語彙、綠色主按鈕）／服務廠端（深藍綠工作台）
         展示流程（瀝青色道路與車道線）／透視掃描是唯一的大動態
   ========================================================= */
:root {
  --red: #EB0A1E; --red-d: #C40818;
  --ink: #15181D; --ink2: #454C59; --ink3: #767F8E; --ink4: #8A93A1;
  --line: #E3E6EB; --line2: #EEF0F3;
  --paper: #E7EAEE;
  --teal: #1B5E80; --teal-d: #123F57; --tealS: #E6F0F5;
  --asph: #23272E; --asph2: #2D323A; --lane: #E9C46A;
  --green: #1E9E5B; --green-d: #16834A; --greenS: #E8F6EE;
  --ai: #3557D6; --aiS: #EEF3FF;
  --chat: #8EA6CC;
  --f-sans: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --f-num: "Saira Semi Condensed", "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Noto Sans TC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--f-sans); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; overflow: hidden; font-size: 14px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
ul, ol { list-style: none; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
:focus-visible { outline: 2px solid #2E7CF6; outline-offset: 2px; border-radius: 6px; }
.ic { flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- 頂部列 ---------- */
.top { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand b { font-size: 18px; font-weight: 900; letter-spacing: .03em; display: block; line-height: 1.15; }
.brand small { font-size: 11.5px; color: var(--ink3); display: block; }
.hk { font-size: 11.5px; padding: 4px 9px; border-radius: 7px; background: #FFF0F1; color: var(--red-d); white-space: nowrap; }
.vtabs { display: flex; gap: 2px; background: var(--line2); padding: 3px; border-radius: 11px; margin-left: auto; }
.vtab { padding: 7px 11px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.vtab:hover { color: var(--ink); }
.vtab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.tclock { font-size: 12px; color: var(--ink3); white-space: nowrap; display: flex; align-items: baseline; gap: 6px; }
.tclock b { font-size: 18px; color: var(--ink); font-weight: 600; }
.tbtn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink2); }
.tbtn:hover { background: var(--line2); }

/* ---------- 版面 ---------- */
.stage { display: grid; grid-template-columns: 300px auto minmax(0, 1fr); gap: 16px; padding: 14px 16px; height: calc(100% - 56px); }
.page-col, .story-col { display: none; }
body[data-view=owner] .stage { grid-template-columns: 300px auto minmax(0, 1fr); }
body[data-view=owner] .console-col, body[data-view=owner] .rail .sc { display: none; }
body[data-view=owner] .story-col { display: flex; align-items: center; min-width: 0; min-height: 0; overflow: auto; }
body[data-view=console] .stage { grid-template-columns: 300px minmax(0, 1fr); }
body[data-view=console] .phone-col { display: none; }
body[data-view=dash] .stage, body[data-view=arch] .stage, body[data-view=pain] .stage { grid-template-columns: minmax(0, 1fr); }
body[data-view=dash] .rail, body[data-view=arch] .rail, body[data-view=pain] .rail,
body[data-view=dash] .phone-col, body[data-view=arch] .phone-col, body[data-view=pain] .phone-col,
body[data-view=dash] .console-col, body[data-view=arch] .console-col, body[data-view=pain] .console-col { display: none; }
body[data-view=dash] .page-col, body[data-view=arch] .page-col, body[data-view=pain] .page-col { display: block; overflow: auto; min-height: 0; }

/* ---------- 按鈕 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 14px; white-space: nowrap; transition: transform .08s, background-color .15s, opacity .15s; }
.btn:active:not([disabled]) { transform: scale(.97); }
.btn[disabled] { opacity: .42; cursor: not-allowed; }
.btn.pri { background: var(--green); color: #fff; }
.btn.pri:hover:not([disabled]) { background: var(--green-d); }
.btn.red { background: var(--red); color: #fff; }
.btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn.ok { background: var(--greenS); color: var(--green-d); border: 1px solid #BFE5CF; }
.btn.ai { background: var(--aiS); color: var(--ai); border: 1px solid #CCD8FB; }
.btn.dark { background: #3A414B; color: #fff; }
.btn.full { width: 100%; }
.btn.sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 9px; }
.btn.sq { width: 42px; padding: 0; flex: none; }
.btn.big { height: 48px; font-size: 15px; width: 100%; }

/* ---------- 展示流程（道路） ---------- */
.rail { background: var(--asph); color: #E8EAED; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.rail-h { padding: 14px 16px 10px; }
.rail-h b { font-size: 15px; }
.rail-h small { color: #9AA3AF; font-size: 12px; margin-left: 8px; }
.rail-prog { height: 3px; background: #3A4049; border-radius: 2px; margin-top: 10px; overflow: hidden; }
.rail-prog i { display: block; height: 100%; background: var(--lane); transition: width .4s; }
.road { flex: 1; overflow: auto; padding: 0 10px 10px; position: relative; min-height: 120px; }
.road::before { content: ""; position: absolute; left: 31px; top: 0; bottom: 0; border-left: 2px dashed rgba(233, 196, 106, .45); }
.phase { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 4px; position: relative; z-index: 1; }
.sign { display: inline-block; background: var(--pc); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 6px; }
.phase small { color: #8D96A3; font-size: 11px; }
.stop { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 6px 8px 6px 10px; border-radius: 10px; position: relative; z-index: 1; }
.stop i { width: 24px; height: 24px; border-radius: 50%; background: var(--asph2); border: 2px solid #4A515B; display: grid; place-items: center; font-style: normal; font-size: 11px; font-family: var(--f-num); font-weight: 600; color: #C9CFD7; flex: none; }
.stop.done i { background: var(--pc); border-color: var(--pc); color: #fff; }
.stop.cur i { border-color: var(--lane); color: var(--lane); box-shadow: 0 0 0 4px rgba(233, 196, 106, .18); }
.stop.run i { animation: runPulse 1.1s ease-in-out infinite; }
@keyframes runPulse { 50% { box-shadow: 0 0 0 7px rgba(233, 196, 106, .08); } }
.stop span { min-width: 0; }
.stop span b { display: block; font-size: 13px; font-weight: 500; color: #E8EAED; }
.stop span small { font-size: 11px; color: #8D96A3; }
.stop em { margin-left: auto; font-style: normal; font-size: 10px; padding: 2px 6px; border-radius: 5px; background: rgba(235, 10, 30, .2); color: #FF8F99; flex: none; }
.stop:hover { background: rgba(255, 255, 255, .05); }
.stop.focus { background: rgba(255, 255, 255, .09); }
.sc { margin: 0 10px 10px; background: #fff; color: var(--ink); border-radius: 14px; padding: 12px 14px; border-top: 4px solid var(--pc); flex: none; }
.sc-h { display: flex; align-items: center; gap: 8px; }
.sc-h .num { font-weight: 700; color: var(--pc); font-size: 16px; }
.sc-h b { font-size: 14px; }
.sc-h em { margin-left: auto; font-style: normal; font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: #FFF0F1; color: var(--red-d); }
.sc-r { margin-top: 7px; }
.sc-r small { font-size: 11px; color: var(--ink3); font-weight: 700; }
.sc-r p { font-size: 12.5px; line-height: 1.55; color: var(--ink2); }
.sc .btn { margin-top: 10px; height: 38px; }
.rail-f { display: grid; grid-template-columns: 38px 38px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; padding: 10px; border-top: 1px solid #343A43; flex: none; }
.rail-f .btn { height: 38px; padding: 0 8px; font-size: 13px; min-width: 0; }
.rail-f .btn.sq { width: 38px; }
.rail-f .btn.ghost { background: #2F353E; border-color: #3D444E; color: #E8EAED; }

.mviews { display: none; }
.rail-h, .mviews, .rail-f { flex: none; }

/* 車主端檢視：大字情境卡 */
.sp { width: 100%; max-width: 640px; background: #fff; border-radius: 22px; padding: 28px 30px; border-top: 6px solid var(--pc); box-shadow: 0 1px 2px rgba(16, 24, 40, .06); }
.sp-ph { display: flex; align-items: center; gap: 10px; }
.sp-ph .sign { font-size: 14px; padding: 4px 11px; }
.sp-ph small { color: var(--ink3); font-size: 13px; }
.sp-n { margin-left: auto; color: var(--ink3); font-size: 18px; font-weight: 600; }
.sp-t { font-size: clamp(26px, 2.6vw, 36px); font-weight: 900; margin: 14px 0 4px; line-height: 1.25; }
.sp-who { color: var(--ink3); font-size: 15px; display: flex; align-items: center; gap: 8px; }
.sp-who em { font-style: normal; font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: #FFF0F1; color: var(--red-d); font-weight: 700; }
.sp-row { margin-top: 18px; }
.sp-row small { display: block; font-size: 13px; font-weight: 700; color: var(--pc); margin-bottom: 4px; }
.sp-row p { font-size: 18px; line-height: 1.65; color: var(--ink); }
.sp-ai { display: flex; gap: 8px; align-items: flex-start; margin-top: 18px; background: var(--aiS); color: #2A3FA8; border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.55; }
.sp-ai .ic { margin-top: 3px; }
.sp-goals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.sp-goals span { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); background: #FAFBFC; }
.sp-f { display: flex; gap: 10px; margin-top: 22px; }
.sp-f .btn { height: 48px; font-size: 15px; padding: 0 20px; }
.sp-f .btn.pri { flex: 1; }

/* ---------- 手機 ---------- */
.phone-col { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
.phone-wrap { position: relative; flex: none; width: 414px; height: 868px; }
.phone { position: absolute; left: 0; top: 0; width: 414px; height: 868px; transform: scale(var(--ps, 1)); transform-origin: top left; background: #0E1013; border-radius: 60px; padding: 12px; box-shadow: 0 30px 60px -22px rgba(16, 24, 40, .5), inset 0 0 0 2px #2B2F36; }
.screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: var(--chat); }
.screen.liff-on { background: #fff; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; background: #000; border-radius: 20px; z-index: 95; }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 8px 30px 0 40px; font-family: var(--f-num); font-weight: 600; font-size: 16px; z-index: 94; color: #000; pointer-events: none; }
.sbar .sig { display: flex; gap: 5px; align-items: center; }
.line-app { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
.lhd { height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 6px; color: #1D2633; flex: none; }
.lhd-n { font-size: 16px; font-weight: 700; }
.vbadge { width: 16px; height: 16px; border-radius: 50%; background: #06C755; color: #fff; display: grid; place-items: center; }
.lhd-sp { flex: 1; }
.chat { flex: 1; overflow-y: auto; padding: 4px 10px 16px; overscroll-behavior: contain; }
.chat::-webkit-scrollbar, .lbody::-webkit-scrollbar { width: 0; }
.msg { display: flex; align-items: flex-end; gap: 6px; margin: 10px 0; }
.msg.oa, .msg.adv { align-items: flex-start; }
.msg .av { width: 36px; height: 36px; flex: none; }
.oa-av { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
.oa-av b { font-size: 7.5px; font-weight: 900; color: var(--red); letter-spacing: .02em; }
.av.adv { border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; width: 36px; height: 36px; flex: none; }
.mcol { max-width: 262px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mname { font-size: 11px; color: #22324A; }
.bub { background: #fff; border-radius: 18px; padding: 9px 12px; font-size: 14.5px; line-height: 1.5; color: #111; word-break: break-word; }
.msg.me { justify-content: flex-end; }
.bub.me { background: #9BE38A; max-width: 250px; }
.mmeta { font-size: 10px; color: #33445E; line-height: 1.25; flex: none; align-self: flex-end; margin-bottom: 2px; }
.msg.me .mmeta { text-align: right; }
.csep { text-align: center; margin: 14px 0; }
.csep span { background: rgba(0, 0, 0, .16); color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 10px; }
.enter { animation: msgIn .38s cubic-bezier(.2, .8, .2, 1); }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.typing { display: flex; gap: 4px; padding: 13px 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9AA3AF; animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
.qr { display: flex; flex-wrap: wrap; gap: 6px; }
.qrb { background: #fff; border: 1px solid #D5DCE6; border-radius: 16px; padding: 5px 11px; font-size: 12.5px; color: #1F5BC4; }

/* Flex 訊息 */
.fx { background: #fff; border-radius: 18px; overflow: hidden; width: 262px; }
.fx-art { display: block; width: 100%; height: auto; }
.fx-b { padding: 14px 15px 4px; font-size: 14px; line-height: 1.55; color: #1A1D23; }
.fx-b p { margin-bottom: 9px; }
.fx-t { font-weight: 700; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.fx-t.center, .center { justify-content: center; text-align: center; }
.fx-sub { font-size: 12.5px; color: #4A5160; }
.fx-date { text-align: center; margin: 6px 0 10px; }
.fx-date span { display: block; font-weight: 700; font-size: 16px; }
.fx-date b { font-size: 36px; color: var(--red); font-weight: 700; line-height: 1.1; }
.fx-dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; color: #4A5160; border-top: 1px solid var(--line2); padding-top: 8px; }
.fx-dl dt { color: var(--ink4); }
.fx-dl .lnk { color: #2E7CF6; }
.fx-ai { display: flex; gap: 6px; align-items: flex-start; margin: 10px 0 6px; font-size: 12px; color: var(--ai); background: var(--aiS); border-radius: 8px; padding: 7px 8px; line-height: 1.45; }
.fx-tbl { display: grid; grid-template-columns: 70px 1fr; background: #F5F7FA; border-radius: 10px; padding: 9px 11px; gap: 5px 8px; font-size: 13px; margin-bottom: 10px; }
.fx-tbl dt { color: #7C8594; font-size: 12px; }
.fx-tbl dd { font-weight: 500; }
.fx-warn { background: #FFF4E0; border-radius: 10px; padding: 8px 10px; color: #6B3B00; }
.fx-mut { color: #6B7380; font-size: 12.5px; }
.fx-btns { padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.fxb { height: 42px; border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.fxb.pri { background: var(--green); color: #fff; }
.fxb.pri:hover { background: var(--green-d); }
.fxb.red { background: var(--red); color: #fff; }
.fxb.ghost { background: #F1F3F6; color: #1A1D23; font-weight: 500; }
.fxb.ghost.green { background: #fff; border: 1.5px solid var(--green); color: var(--green-d); font-weight: 700; }
.fxb.list { background: #fff; border: 1px solid var(--line); justify-content: flex-start; padding: 0 14px; font-weight: 500; color: #1A1D23; }
.fxb.list .ic { color: var(--teal); }
.fx-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fx-scan { background: radial-gradient(120% 120% at 30% 30%, #19355A, #0B1628); margin: 2px 12px 4px; border-radius: 14px; padding: 12px 14px; display: flex; gap: 16px; align-items: center; }
.mcar { position: relative; width: 60px; height: 120px; flex: none; }
.mcar svg { width: 100%; height: 100%; display: block; }
.mcar i { position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(11, 22, 40, .9); }
.fx-pills { display: flex; flex-direction: column; gap: 8px; }
.fx-pills span { font-size: 12px; color: #DCE3EC; display: flex; align-items: center; gap: 7px; }
.fx-pills i { width: 8px; height: 8px; border-radius: 50%; }
.fx-bar { height: 8px; border-radius: 4px; background: #E3ECE7; overflow: hidden; margin: 4px 0 6px; }
.fx-bar i { display: block; height: 100%; background: var(--green); border-radius: 4px; }
.fx-barl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #5A6270; margin-bottom: 6px; }
.fx-item { display: flex; gap: 10px; background: #F5F7FA; border-radius: 10px; padding: 8px; margin-bottom: 8px; }
.fx-th { width: 56px; height: 44px; flex: none; background: #fff; border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.fx-th svg { width: 100%; height: 100%; }
.fx-item b { display: block; font-size: 13.5px; }
.fx-item small { display: block; font-size: 11.5px; color: #6B7380; line-height: 1.4; }
.early { font-style: normal; margin-left: 6px; font-size: 11px; background: var(--greenS); color: var(--green-d); padding: 1px 6px; border-radius: 5px; font-weight: 700; }
.fx-stars { display: flex; justify-content: center; gap: 2px; margin: 4px 0 8px; }
.fx-stars button { color: #F2B705; padding: 2px; }
.fx-stars .ic, .stars .ic { fill: currentColor; }
.fx-foot { font-size: 11.5px; color: #6B7380; padding: 0 14px 12px; margin-top: -4px; text-align: center; line-height: 1.45; }
.fx-tip { background: #F2F8F4; border-radius: 10px; padding: 9px 11px; margin-bottom: 9px; }
.fx-tip b { display: block; font-size: 13px; color: #067647; margin-bottom: 3px; }
.fx-tip span { font-size: 12.5px; color: #2A2F38; line-height: 1.6; }
.lx { display: grid; gap: 8px; }
.lxr { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.lxr .oic { margin: 0; flex: none; }
.lxr span:nth-child(2) { flex: 1; }
.lxr b { display: block; font-size: 13.5px; }
.lxr small { font-size: 11.5px; color: #7C8594; }
.lxr em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--green-d); background: var(--greenS); border-radius: 8px; padding: 4px 10px; }
.carpick { display: flex; align-items: center; gap: 12px; width: 100%; background: #F3F7FC; border-radius: 12px; padding: 10px 12px; text-align: left; color: var(--red); }
.carpick div { flex: 1; }
.carpick b { display: block; font-size: 15px; color: var(--ink); }
.carpick small { font-size: 11.5px; color: var(--ink4); }

/* 圖文選單與輸入列 */
.foot { background: #fff; flex: none; padding-bottom: 22px; }
.rich { background: linear-gradient(#EAF3FD, #F8FBFF); border-top: 1px solid #D9E2EC; }
.rtabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.rtab { height: 34px; font-size: 12.5px; color: #7C8594; background: #E7EDF3; border-bottom: 1px solid #D9E2EC; }

/* 車況檢查結果：透視台 */

.xstage { position: relative; height: 372px; background: radial-gradient(120% 80% at 50% 42%, #1A3A63 0%, #0D1B30 58%, #070F1D 100%); overflow: hidden; }
.xgrid { position: absolute; inset: 0; background-image: linear-gradient(rgba(94, 200, 255, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(94, 200, 255, .09) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 35%, transparent 78%); mask-image: radial-gradient(circle at 50% 45%, #000 35%, transparent 78%); }
.xcar { position: absolute; left: 50%; top: 14px; height: 344px; width: 172px; transform: translateX(-50%); }
.lay { position: absolute; inset: 0; transition: opacity .3s; }
.lay svg { width: 100%; height: 100%; display: block; }
.lay.xr { clip-path: inset(0 0 100% 0); }
.scanning .lay.xr { animation: sweep 2.2s cubic-bezier(.45, 0, .55, 1) .3s forwards; }
@keyframes sweep { 0% { clip-path: inset(0 0 100% 0); } 10% { clip-path: inset(0 0 82% 0); } 90% { clip-path: inset(82% 0 0 0); } 100% { clip-path: inset(100% 0 0 0); } }
.scanbar { position: absolute; left: -40%; right: -40%; height: 2px; top: 0; background: linear-gradient(90deg, transparent, #8BE7FF, transparent); box-shadow: 0 0 18px 4px rgba(127, 227, 255, .5); opacity: 0; pointer-events: none; }
.scanning .scanbar { animation: bar 2.2s cubic-bezier(.45, 0, .55, 1) .3s forwards; }

.xray-on .lay.xr { clip-path: none; animation: none; }
.xray-on .lay.solid { opacity: .1; }
.cbody { stroke: #8D9AAB; stroke-width: 1.2; }
.cw { fill: #1A1E25; }
.croof { stroke: rgba(0, 0, 0, .05); }
.cline { fill: none; stroke: rgba(80, 95, 115, .35); stroke-width: 1.2; }

.ctl { fill: #D8323C; }
.crail { stroke: #8E9AAA; stroke-width: 3; stroke-linecap: round; fill: none; }
.cfin { fill: #2B3038; }

.is-xray .cbody { fill: rgba(94, 200, 255, .05); stroke: #6FD0FF; stroke-width: 1.4; }
.is-xray .cglass, .is-xray .croof { fill: none; stroke: rgba(111, 208, 255, .45); stroke-width: 1; }
.is-xray .cw { fill: rgba(94, 200, 255, .08); stroke: #6FD0FF; stroke-width: 1.2; }

.xc { fill: rgba(94, 200, 255, .1); stroke: #93E3FF; stroke-width: 1.2; }
.xd { fill: none; stroke-dasharray: 4 3; }

.hs { position: absolute; transform: translate(-50%, -50%) scale(0); width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 14px; box-shadow: 0 0 0 3px rgba(255, 255, 255, .95), 0 4px 14px rgba(0, 0, 0, .45); z-index: 3; }

.rp-body { padding: 12px 14px 0; }

/* 品項說明 */

.plain p { font-size: 14px; line-height: 1.65; }
.pho { margin-top: 10px; border-radius: 14px; overflow: hidden; background: var(--ink); position: relative; }
.pho svg, .pho img { display: block; width: 100%; height: 168px; object-fit: cover; }
.pho figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 10px 8px; background: linear-gradient(transparent, rgba(0, 0, 0, .72)); display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 11px; color: #E8EAED; }
.pho figcaption span { display: flex; align-items: center; gap: 4px; }

.cost { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 10px; }
.cost > div { background: #fff; border-radius: 14px; padding: 10px 12px; }

.cost span { display: block; font-size: 11.5px; color: #5A6270; line-height: 1.45; }
.src { font-size: 11px; color: var(--ink4); margin-top: 10px; }

/* AI 助手 */
.aibody { background: #EDF0F5; padding: 0 0 10px; }
.ai-ctx { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border-bottom: 1px solid var(--line); }

.ai-ctx small { display: block; font-size: 11px; color: #7C8594; }
.ai-ctx b { font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-ctx em { font-style: normal; font-size: 10.5px; color: var(--ai); background: var(--aiS); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.ai-list { padding: 12px 12px 0; }
.ai-msg { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-start; }
.ai-msg.me { justify-content: flex-end; }
.av.ai { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #4C6FFF, #7A5CFF); color: #fff; display: grid; place-items: center; flex: none; }
.ai-col { max-width: 86%; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ai-bub { background: #fff; border-radius: 4px 16px 16px 16px; padding: 10px 12px; font-size: 14px; line-height: 1.62; }
.ai-msg.me .ai-bub { background: var(--green); color: #fff; border-radius: 16px 4px 16px 16px; max-width: 82%; }
.ai-meta { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: #7C8594; padding: 0 4px; gap: 8px; }

.fb { display: flex; gap: 2px; flex: none; }
.fb button { width: 30px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #8A93A1; }
.fb button.on { color: var(--ai); background: #E5ECFF; }
.handoff { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: #FFF4E0; border-radius: 10px; padding: 7px 8px; font-size: 12px; color: #6B3B00; line-height: 1.4; }
.handoff span { flex: 1; min-width: 120px; }
.handoff .btn { height: 28px; background: #fff; border: 1px solid #F0C987; color: #6B3B00; }
.ai-sug { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 12px; }
.chipbtn { background: #fff; border: 1px solid #CCD8FB; color: var(--ai); border-radius: 16px; padding: 6px 11px; font-size: 12.5px; }
.chipbtn.on { background: var(--ai); color: #fff; border-color: var(--ai); }
.ai-in { display: flex; gap: 6px; width: 100%; align-items: center; }
.ai-in input { flex: 1; height: 42px; border-radius: 21px; border: 1px solid var(--line); padding: 0 14px; background: #F5F7FA; outline: none; font-size: 14px; min-width: 0; }
.ai-in button { width: 42px; height: 42px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }

/* 選擇施作、報價 */
.sel-intro { font-size: 12.5px; color: #5A6270; margin-bottom: 10px; line-height: 1.55; }
.sg { background: #fff; border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
.sg-h { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: var(--s); color: var(--i); font-weight: 700; font-size: 13px; }
.sg-h i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.srow { display: flex; align-items: center; border-top: 1px solid var(--line2); }
.sck { flex: 1; display: flex; align-items: center; gap: 10px; padding: 11px 2px 11px 12px; text-align: left; min-width: 0; }
.cbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #C3CAD4; display: grid; place-items: center; flex: none; color: #fff; transition: background-color .15s, border-color .15s; }
.srow.on .cbox { background: var(--green); border-color: var(--green); }
.sinfo { flex: 1; min-width: 0; }
.sinfo b { display: block; font-size: 14.5px; }
.sinfo small { display: block; font-size: 12px; color: #7C8594; margin-top: 1px; }
.sprice { text-align: right; flex: none; }
.sprice b { font-size: 16px; font-weight: 700; display: block; }
.sprice small { display: block; font-size: 11px; color: #7C8594; }
.sinfo-btn { width: 40px; height: 44px; display: grid; place-items: center; color: #8A93A1; flex: none; }
.merge { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--teal); background: var(--tealS); border-radius: 10px; padding: 8px 10px; line-height: 1.5; }
.sumbar { display: flex; align-items: center; gap: 10px; width: 100%; }
.sum-l { flex: 1; display: flex; flex-direction: column; font-size: 12px; color: #5A6270; gap: 1px; min-width: 0; }
.sum-l b { color: var(--ink); font-size: 13.5px; }
.sumbar .btn { flex: none; }
.q-head { background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.q-head b { display: block; font-size: 15px; }
.q-head small { font-size: 11.5px; color: #7C8594; }
.qsec { background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.qsec h5 { display: flex; align-items: center; gap: 7px; font-size: 14px; margin-bottom: 4px; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 3px solid; }
.dot.b { border-color: #2E7CF6; } .dot.o { border-color: #F29100; }
.ql { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--line2); }
.ql.sub { border: 0; font-weight: 700; padding-top: 8px; }
.ql.mut { color: var(--ink4); }
.qtot { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 14px; padding: 12px; }
.qtot small { display: block; font-size: 11px; color: #7C8594; }
.big { font-size: 30px; font-weight: 700; }
.qeta { background: #E9EEF4; border-radius: 12px; padding: 10px 12px; margin-top: 10px; display: grid; gap: 4px; font-size: 13px; }
.qeta div { display: flex; align-items: center; gap: 10px; }
.qeta span { color: #5A6270; width: 112px; }
.qeta b { font-size: 16px; }
.qeta em { font-style: normal; color: #D92D20; font-weight: 700; font-size: 13px; }
.qskip { display: flex; gap: 7px; align-items: flex-start; margin-top: 10px; font-size: 12.5px; color: #175CD3; background: #EAF2FE; border-radius: 10px; padding: 8px 10px; line-height: 1.5; }
.agree { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 13px; line-height: 1.5; background: #fff; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.agree input { width: 20px; height: 20px; accent-color: var(--green); margin-top: 1px; flex: none; }
.sigwrap { position: relative; margin-top: 10px; background: #fff; border-radius: 12px; border: 1.5px dashed #C3CAD4; height: 120px; }
.sigwrap canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; border-radius: 12px; }
.sig-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; color: #A0A8B4; font-size: 13px; pointer-events: none; }
.sig-ph.hide { display: none; }
.sig-clr { position: absolute; right: 8px; top: 6px; font-size: 12px; color: #5A6270; padding: 2px 6px; }
.signed { display: flex; align-items: center; gap: 10px; margin-top: 12px; background: var(--greenS); border-radius: 12px; padding: 10px 12px; color: #067647; }
.signed div { flex: 1; }
.signed b { display: block; font-size: 13.5px; }
.signed small { font-size: 11.5px; }
.signed img { width: 90px; height: 40px; object-fit: contain; background: #fff; border-radius: 6px; }

/* 維修進度 */
.pg-hero { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px; }
.pg-ring { position: relative; width: 132px; height: 132px; flex: none; }
.pg-ring svg { display: block; }
.ring circle { transition: stroke-dashoffset .6s; }
.pg-rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pg-rc small { font-size: 11px; color: #7C8594; }
.pg-rc b { font-size: 30px; font-weight: 700; line-height: 1.1; }
.pg-t b { display: block; font-size: 17px; }
.pg-t span { display: block; font-size: 13px; color: #2A2F38; margin-top: 4px; line-height: 1.45; }
.pg-t small { display: block; font-size: 11.5px; color: #7C8594; margin-top: 6px; }
.tl { background: #fff; border-radius: 16px; padding: 14px; margin-top: 10px; }
.tl li { display: grid; grid-template-columns: 20px 44px 1fr; gap: 8px; position: relative; padding-bottom: 14px; }
.tl li:last-child { padding-bottom: 0; }
.tl li::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: #E3E6EB; }
.tl li:last-child::before { display: none; }
.tl li.done::before { background: var(--green); }
.tl i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C9CFD7; background: #fff; display: grid; place-items: center; color: #fff; z-index: 1; position: relative; }
.tl li.done i { background: var(--green); border-color: var(--green); }
.tl li.cur i { border-color: var(--green); box-shadow: 0 0 0 4px rgba(30, 158, 91, .16); }
.tl li.cur i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.2s infinite; }
.tl .num { font-size: 13px; color: #5A6270; padding-top: 1px; }
.tl b { display: block; font-size: 13.5px; }
.tl small { display: block; font-size: 11.5px; color: #7C8594; }
.tl li:not(.done):not(.cur) b { color: #7C8594; font-weight: 500; }
.free { margin-top: 2px; }
.swrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: #fff; border-radius: 12px; padding: 12px; font-size: 13.5px; margin: 8px 0; text-align: left; }
.swrow span { display: flex; gap: 8px; align-items: center; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: #D5DAE1; position: relative; flex: none; transition: background-color .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: left .2s; }
.sw.on { background: var(--green); }
.sw.on::after { left: 21px; }
.opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.opt { background: #fff; border-radius: 12px; padding: 10px 9px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.oic { width: 30px; height: 30px; border-radius: 9px; background: #F1F3F6; display: grid; place-items: center; margin-bottom: 4px; color: var(--teal); }
.opt b { font-size: 13px; }
.opt small { font-size: 11px; color: #7C8594; line-height: 1.35; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 60px 20px; color: #7C8594; }
.empty b { color: var(--ink); }

/* 追加項目 */
.addon-flag { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: #6B3B00; background: #FFF4E0; border-radius: 8px; padding: 4px 9px; margin-bottom: 8px; }
.choice { display: grid; gap: 8px; margin-top: 10px; }
.choice div { background: #fff; border-radius: 12px; padding: 10px 12px; border: 1.5px solid var(--line); }
.choice div.on { border-color: var(--green); background: #F3FBF6; }
.choice b { display: block; font-size: 14px; }
.choice span { font-size: 12.5px; color: #5A6270; }
.decided { display: flex; gap: 6px; align-items: center; margin-top: 10px; color: #067647; font-weight: 700; font-size: 13px; }

/* 維修紀錄、付款、評價、客休 */
.rc-hero { display: flex; align-items: center; gap: 12px; background: var(--greenS); border-radius: 16px; padding: 14px; color: #067647; }
.rc-ic { width: 46px; height: 46px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }

.rc-hero span { font-size: 12.5px; }
.health { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
.hl-r { position: relative; width: 104px; height: 104px; flex: none; }
.hl-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hl-c b { font-size: 30px; font-weight: 700; line-height: 1; }
.hl-c small { font-size: 11px; color: #7C8594; }
.hl-t b { display: block; font-size: 15px; }
.hl-t span { display: block; font-size: 13px; margin: 4px 0; }
.hl-t span b { display: inline; font-size: 15px; }
.hl-t small { font-size: 11.5px; color: #7C8594; }
.done-list { background: #fff; border-radius: 14px; padding: 2px 12px; }
.dl { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line2); }
.dl:last-child { border-bottom: 0; }
.dk { width: 20px; height: 20px; border-radius: 50%; background: var(--greenS); color: var(--green); display: grid; place-items: center; }
.dl b { font-size: 13.5px; }
.dl small { display: block; font-size: 11.5px; color: #7C8594; }
.dl.tot b { font-size: 15px; }
.checks { display: grid; gap: 7px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #6B7380; line-height: 1.45; }
.checks li .ic { color: #C3CAD4; margin-top: 2px; }

.checks li.on { color: #2A2F38; }
.lbody .checks { background: #fff; border-radius: 14px; padding: 11px 12px; }

.lbody .checks li { color: #2A2F38; }
.next { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 14px; padding: 10px 12px; }
.next b { font-size: 20px; font-weight: 700; }
.next small { display: block; font-size: 11.5px; color: #7C8594; }
.pay-amt { background: #fff; border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 10px; }
.pay-amt small { font-size: 12px; color: #7C8594; }
.pay-amt b { display: block; font-size: 36px; font-weight: 700; }
.pay-amt span { font-size: 11.5px; color: var(--ink4); }
.pay-calc { background: #fff; border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; font-size: 13.5px; }

.pay-m { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

.note { font-size: 11.5px; color: var(--ink4); margin-top: 10px; line-height: 1.5; }
.paid { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 50px 20px; }
.paid b { font-size: 18px; }
.paid span { font-size: 13px; color: #5A6270; }
.paid small { font-size: 12px; color: var(--ink4); }
.srv { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.srv > b { display: block; font-size: 14px; margin-bottom: 6px; }
.stars { display: flex; gap: 4px; }
.stars button { color: #D5DAE1; padding: 2px; }
.stars button.on { color: #F2B705; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.mi { background: #fff; border-radius: 12px; padding: 12px 6px; border: 1.5px solid transparent; text-align: center; }
.mi.on { border-color: var(--green); background: #F3FBF6; }
.mi b { display: block; font-size: 13.5px; }
.mi small { font-size: 11px; color: #7C8594; }
.seg { display: flex; background: #E7EBF0; border-radius: 10px; padding: 3px; margin-top: 12px; gap: 2px; }
.seg button { flex: 1; min-height: 34px; padding: 4px 6px; border-radius: 8px; font-size: 12.5px; color: #5A6270; }
.seg button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg.sm { margin: 0; }

/* 預約 */
.bi-top { background: #fff; border-radius: 16px; padding: 14px; text-align: center; }
.bi-top small { font-size: 13px; color: #5A6270; }
.bi-top b { display: block; font-size: 42px; font-weight: 700; color: var(--red); line-height: 1.1; }
.bi-top span { font-size: 13px; }
.arrive { display: flex; gap: 10px; align-items: flex-start; background: var(--greenS); color: #067647; border-radius: 14px; padding: 12px; margin-top: 10px; }
.arrive.busy { background: #FFF4E0; color: #6B3B00; }
.arrive b { display: block; font-size: 14px; color: var(--ink); }
.arrive small { font-size: 12px; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; background: #fff; border-radius: 14px; padding: 12px; margin-top: 10px; font-size: 13px; line-height: 1.45; }
.kv dt { color: #7C8594; }
.kv.sm { background: none; padding: 0; margin: 0; }
.bk-hero { display: flex; gap: 10px; align-items: center; background: linear-gradient(135deg, #DCEBFB, #F2F8FF); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
.bk-hero b { display: block; font-size: 19px; font-weight: 900; }
.bk-hero span { display: block; font-size: 11.5px; color: #454C59; line-height: 1.5; margin-top: 4px; }
.plate-s { color: #2E7CF6; font-weight: 700; font-size: 12px; font-family: var(--f-num); }
.bk-art { width: 112px; flex: none; }
.bk-art svg { width: 100%; border-radius: 10px; display: block; }
.form { background: #fff; border-radius: 16px; padding: 12px; display: grid; gap: 13px; }
.f { display: flex; flex-direction: column; gap: 6px; }
.f > span { font-size: 13px; font-weight: 500; }
.form .f > span::before { content: "* "; color: var(--red); }
.f input, .f select, .f textarea { height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: #fff; font-size: 14px; outline: none; width: 100%; }
.f textarea { height: 70px; padding: 10px 12px; resize: none; }
.f input:disabled { background: #F1F3F6; color: #7C8594; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: #2E7CF6; }
.radio { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
.radio i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #C3CAD4; flex: none; margin-top: 1px; }
.radio.on { border-color: var(--red); background: #FFF6F7; }
.radio.on i { border: 5px solid var(--red); }
.radio b { display: block; font-size: 13.5px; }
.radio small { font-size: 11.5px; color: #7C8594; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.slots button { height: 38px; border-radius: 9px; border: 1px solid var(--line); font-family: var(--f-num); font-size: 14px; }
.slots button.on { background: var(--red); border-color: var(--red); color: #fff; }
.slots button:disabled { color: #C3CAD4; text-decoration: line-through; cursor: not-allowed; }

/* ---------- 服務廠工作台 ---------- */
.console-col { min-width: 0; min-height: 0; }
.cs { height: 100%; background: #fff; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 0 0 1px rgba(16, 24, 40, .05); }
.cs-h { height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: var(--teal-d); color: #fff; flex: none; }
.cs-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cs-brand b { font-size: 14.5px; white-space: nowrap; }
.cs-brand span { font-size: 12px; color: #A9C6D6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: #CFE0EA; white-space: nowrap; }
.cs-time { display: flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, .1); border-radius: 8px; padding: 4px 8px; }

.sigrec img { width: 110px; height: 48px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--line); flex: none; }

.nodes li.cur { background: #EDF7F1; }

.gate-svg { display: block; width: 100%; height: auto; }

.cam-res { position: absolute; right: 10px; top: 8px; background: rgba(62, 229, 155, .14); border: 1px solid #3EE59B; color: #3EE59B; font-family: var(--f-num); font-weight: 700; padding: 3px 8px; border-radius: 6px; font-size: 13px; }

.gate-car { animation: carIn 1s cubic-bezier(.2, .8, .2, 1); transform-box: fill-box; transform-origin: center; }
@keyframes carIn { from { transform: translateY(-30px) scale(.72); opacity: 0; } to { transform: none; opacity: 1; } }
.gate-lock { opacity: 0; transition: opacity .3s; }
.camv.matched .gate-lock, .camv.pushed .gate-lock { opacity: 1; }
.camv.scanning .gate-lock { animation: blink .35s 3; }

/* ---------- 成效儀表板、架構 ---------- */
.pg { max-width: 1240px; margin: 0 auto; padding: 4px 4px 40px; display: grid; gap: 14px; }

/* ---------------------------------------------------------
   2D 俯視車體（車頭朝上；車主坐左側）
   --------------------------------------------------------- */
function carGeo(type) {
  const b = BODY[type] || BODY.suv;
  const VW = 240, VH = 480, cx = 120;
  const L = b.L, W = b.W, hw = W / 2, y0 = (VH - L) / 2, y1 = y0 + L;
  const fa = y0 + L * b.fa, ra = y0 + L * b.ra;
  const wsT = y0 + b.hood, wsB = wsT + b.ws, rfE = wsB + b.roof, rwE = rfE + b.rw;
  return { b, VW, VH, cx, L, W, hw, y0, y1, fa, ra, wsT, wsB, rfE, rwE };
}

function carAnchors(type) {
  const g = carGeo(type);
  return {
    ENG: [g.cx, g.y0 + g.b.hood * 0.5],
    FL: [g.cx - g.hw - 4, g.fa],
    FR: [g.cx + g.hw + 4, g.fa],
    RL: [g.cx - g.hw - 4, g.ra],
    RR: [g.cx + g.hw + 4, g.ra],
    CAB: [g.cx, g.wsB + g.b.roof * 0.48],
    REAR: [g.cx, g.y1 - 16],
  };
}

function carBodyPath(g) {
  const { cx, hw, y0, y1, fa, ra, b } = g;
  const f = b.rF, r = b.rR;
  return `M${cx} ${y0}
    C${cx + hw * .55} ${y0} ${cx + hw * .9} ${y0 + 4} ${cx + hw * .95} ${y0 + f * .7}
    C${cx + hw} ${y0 + f} ${cx + hw} ${fa - 30} ${cx + hw} ${fa}
    L${cx + hw} ${ra}
    C${cx + hw} ${y1 - r * .9} ${cx + hw * .96} ${y1 - 6} ${cx + hw * .7} ${y1 - 2}
    C${cx + hw * .4} ${y1 + 1} ${cx - hw * .4} ${y1 + 1} ${cx - hw * .7} ${y1 - 2}
    C${cx - hw * .96} ${y1 - 6} ${cx - hw} ${y1 - r * .9} ${cx - hw} ${ra}
    L${cx - hw} ${fa}
    C${cx - hw} ${fa - 30} ${cx - hw} ${y0 + f} ${cx - hw * .95} ${y0 + f * .7}
    C${cx - hw * .9} ${y0 + 4} ${cx - hw * .55} ${y0} ${cx} ${y0} Z`;
}

    extra += `<path d="M${cx - hw + 2.5} ${g.wsB + 40} L${cx - hw + 2.5} ${g.rfE - 6} M${cx + hw - 2.5} ${g.wsB + 40} L${cx + hw - 2.5} ${g.rfE - 6}" class="cline"/>`;

    const disc = (x, y, s) => `<path d="M${x} ${y - 16} V${y + 16}" class="xc xdisc"/><rect x="${x + (s > 0 ? -7 : 2)}" y="${y - 7}" width="5" height="14" rx="1.5" class="xc"/>`;
    const discs = disc(cx + hw - 17, fa, 1) + disc(cx - hw + 17, fa, -1) + disc(cx + hw - 17, ra, 1) + disc(cx - hw + 17, ra, -1);
    const seatW = hw * 0.62, seatH = 34;
    const rows = type === 'mpv' ? 3 : 2;
    let seats = `<rect x="${cx - hw * .74}" y="${wsB + 14}" width="${seatW}" height="${seatH}" rx="8" class="xc"/>
      <rect x="${cx + hw * .12}" y="${wsB + 14}" width="${seatW}" height="${seatH}" rx="8" class="xc"/>
      <ellipse cx="${cx - hw * .43}" cy="${wsB + 4}" rx="11" ry="3.5" class="xc"/>`;
    for (let i = 1; i < rows; i++) {
      seats += `<rect x="${cx - hw * .74}" y="${wsB + 14 + i * (seatH + 16)}" width="${hw * 1.48}" height="${seatH - 4}" rx="9" class="xc"/>`;
    }
    const acf = `<rect x="${cx + hw * .28}" y="${wsB - 10}" width="22" height="9" rx="1.5" class="xc xhot"/><path d="M${cx + hw * .28 + 5} ${wsB - 10}v9M${cx + hw * .28 + 11} ${wsB - 10}v9M${cx + hw * .28 + 17} ${wsB - 10}v9" class="xc"/>`;
    const exh = `<path d="M${cx - 10} ${wsB + 30} C${cx - 14} ${rfE} ${cx - hw * .45} ${ra + 10} ${cx - hw * .5} ${y1 - 4}" class="xc xd"/>`;

}

function treadInner(mm, uneven) {
  const base = 50;
  const blocks = [0, 1, 2, 3, 4].map(i => {
    let d = mm;
    if (uneven) d = mm + (i - 2) * 0.35;
    const h = Math.max(2, d / 8 * 26), x = 14 + i * 19.5;
    return `<rect x="${x}" y="${base - h}" width="15" height="${h + 2}" rx="2" fill="#3B414B"/><rect x="${x}" y="${base - h}" width="15" height="2" rx="1" fill="#5A616D"/>`;
  }).join('');
  return `<path d="M8 76 Q8 52 18 50 H102 Q112 52 112 76 Z" fill="#262A31"/>
    <path d="M12 59 H108" stroke="#454B55" stroke-width="1" stroke-dasharray="3 3"/>
    ${blocks}

}

function rotorInner(grooved) {

function artFor(item, which) {
  const c = item.cmp || {};
  switch (c.kind) {
    case 'pad': return svgWrap(padInner(which === 'new' ? STD.padNew : c.cur));
    case 'tread': return which === 'new' ? svgWrap(treadInner(STD.treadNew, false)) : svgWrap(tires4Inner(S.meas), '0 0 160 124');
    case 'oil': return svgWrap(oilInner(which === 'new'));
    case 'filter': return svgWrap(filterInner(which === 'new' ? '良好' : S.meas.ac));
    case 'rotor': return svgWrap(rotorInner(which !== 'new'));
    default: return '';
  }
}

function thumbArt(kind) {
  switch (kind) {
    case 'pad': return svgWrap(padInner(3.2));
    case 'tread': return svgWrap(treadInner(4.1, true));
    case 'oil': return svgWrap(oilInner(false));
    case 'filter': return svgWrap(filterInner('輕微髒污'));
    case 'rotor': return svgWrap(rotorInner(true));
    default: return '';
  }
}

/* 健康度環（完工頁） */
function ringSVG(pct, size = 120, stroke = 10, color = '#1E9E5B', track = '#E5E9EE') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
  </svg>`;
}

/* ---------- 規則引擎：嚴重度依原廠標準判定（AI 不決定嚴重度） ---------- */
function rules(m = S.meas) {
  const minPad = Math.min(m.padFR, m.padFL);
  const kmLeft = Math.max(0, (minPad - STD.padLimit) / STD.padWearPerK * 1000);
  const brakeSev = minPad <= STD.padLimit ? 'p1' : kmLeft < 10000 ? 'p1' : kmLeft < 20000 ? 'p2' : 'ok';
  const front = (m.trFL + m.trFR) / 2, rear = (m.trRL + m.trRR) / 2, diff = rear - front;
  const rotSev = diff >= STD.rotateDiff ? 'p2' : diff >= 1.0 ? 'p3' : 'ok';
  const oilSev = m.oilKm >= STD.oilInterval ? 'p2' : m.oilKm >= 9000 ? 'p3' : 'ok';
  const acSev = m.ac === '髒污' ? 'p2' : m.ac === '輕微髒污' ? 'p3' : 'ok';
  return { minPad, kmLeft, brakeSev, front, rear, diff, rotSev, oilSev, acSev };
}

const ITEM_IDS = ['brake', 'rotate', 'oil', 'ac'];
function findings() {
  return ITEM_IDS.map(itemView).filter(v => v && v.sev !== 'ok')
    .sort((a, b) => SEV_ORDER.indexOf(a.sev) - SEV_ORDER.indexOf(b.sev));
}
function sevCounts() {
  const c = { p1: 0, p2: 0, p3: 0, ok: NORMALS.length };
  findings().forEach(v => c[v.sev]++);
  ITEM_IDS.map(itemView).forEach(v => { if (v.sev === 'ok') c.ok++; });
  return c;
}
function zoneItems(z) { return findings().filter(v => v.zones.includes(z)); }
function zoneSev(z) {
  const its = zoneItems(z);
  if (!its.length) return 'ok';
  return its.map(v => v.sev).sort((a, b) => SEV_ORDER.indexOf(a) - SEV_ORDER.indexOf(b))[0];
}

/* ---------- 報價與完工時間（標準工時 + 施工節點） ---------- */
function selectedItems() {
  const out = [];
  ITEM_IDS.forEach(id => { if (S.sel[id]) out.push(itemView(id)); });
  if (S.addonState === 'accepted') out.push(itemView('rotor'));
  return out;
}
function quote() {
  const its = selectedItems();
  const base = its.filter(v => v.base);
  const add = its.filter(v => !v.base);
  const baseSum = base.reduce((a, v) => a + v.price, 0);
  const addSum = add.reduce((a, v) => a + v.price, 0);
  return { its, base, add, baseSum, addSum, total: baseSum + addSum, count: its.length };
}
function plan() {
  const start = S.work.start ?? Math.max(T('14:28'), S.now + 8);
  const seq = [];
  if (S.sel.brake) seq.push({ id: 'brake', label: '前煞車來令片更換', min: PRICE.brake.labor });
  if (S.sel.brake && S.addonState === 'accepted') seq.push({ id: 'rotor', label: '前煞車碟盤研磨', min: PRICE.rotor.labor });
  if (S.sel.rotate) seq.push({ id: 'rotate', label: '輪胎調位・胎壓調整', min: S.sel.brake ? PRICE.rotate.labor : PRICE.rotate.laborAlone });
  seq.push({ id: 'base', label: S.sel.oil ? '定期保養（機油・濾芯・定保檢查）' : '定保檢查項目', min: S.sel.oil ? 27 : 15 });
  if (S.sel.ac) seq.push({ id: 'ac', label: '空調濾網更換', min: PRICE.ac.labor });
  seq.push({ id: 'final', label: '最終檢測・試車・洗車', min: 15 });
  let t = start;
  seq.forEach(n => { n.s = t; t += n.min; n.e = t; });
  const baseEta = start + (S.sel.oil ? 27 : 15) + 15;
  return { start, nodes: seq, eta: t, baseEta, delta: t - baseEta };
}
function workPct() {
  if (S.work.doneAt != null) return 1;
  if (S.work.start == null) return 0;
  const p = plan();
  return clamp((S.now - p.start) / (p.eta - p.start), 0, 0.99);
}
function currentNode() {
  const p = plan();
  if (S.work.doneAt != null) return null;
  return p.nodes.find(n => S.now >= n.s && S.now < n.e) || (S.now < p.start ? null : p.nodes[p.nodes.length - 1]);
}
function healthScore(after) {
  let s = 100;
  const its = findings();
  its.forEach(v => {
    const done = after && (S.sel[v.id]);
    if (!done) s -= SEV[v.sev].pen;
  });
  if (after && S.addonState === 'declined') s -= SEV.p3.pen;
  if (!after) s -= 0;
  return Math.max(40, s);
}

function detectIntent(q) {
  const s = String(q).replace(/\s/g, '');
  let best = { id: 'unknown', n: 0 };
  INTENTS.forEach(it => {
    const n = it.kw.reduce((a, k) => a + (s.includes(k) ? k.length * it.w : 0), 0);
    if (n > best.n) best = { id: it.id, n };
  });
  return best.id;
}

function localAnswer(key, q) {
  const intent = detectIntent(q);
  if (key === 'general') return generalAnswer(q, intent);
  const v = itemView(key);
  const kb = KB[key] || {};
  let text, handoff = false;
  if (intent === 'safety' && !kb.safety) { text = HANDOFF_SAFETY(v); handoff = true; }
  else if (intent === 'safety') { text = kb.safety(v); }
  else if (intent === 'warranty') { text = HANDOFF_WARRANTY(v); handoff = true; }
  else if (kb[intent]) { text = kb[intent](v); }
  else { text = UNKNOWN(); handoff = true; }
  const follow = {
    skip: ['為什麼會磨損這麼快？', '費用包含哪些？'], why: ['這次不更換可以嗎？', '更換需要多久？'],
    cost: ['更換需要多久？', '原廠零件差在哪？'], time: ['費用包含哪些？', '這次不更換可以嗎？'],
    what: ['這次不更換可以嗎？', '怎麼自己判斷？'], oem: ['費用包含哪些？', '這次不更換可以嗎？'],
    self: ['這次不更換可以嗎？', '費用包含哪些？'], safety: ['費用包含哪些？', '更換需要多久？'],
    warranty: ['費用包含哪些？', '更換需要多久？'], unknown: ['這次不更換可以嗎？', '費用包含哪些？'],
  }[intent] || [];
  return { text, handoff, intent, followups: follow, sources: handoff ? ['本次工單', '轉由服務專員確認'] : v.sources };
}

function generalAnswer(q, intent) {
  const s = q.replace(/\s/g, '');
  if (/進度|好了|完成了|還要多久|多久|修好/.test(s)) return { kind: 'progress' };
  if (/專員|真人|客服|人工|打電話/.test(s)) return { kind: 'advisor' };
  if (/預約|改時間|改約/.test(s)) return { kind: 'booking' };
  if (/多少錢|費用|報價|總共/.test(s)) {
    const qt = quote();
    return { text: `目前勾選 ${qt.count} 項，預估總額 ${money(qt.total)}（含零件、工資、稅）。可以在「報價與施作確認」查看明細與調整項目。`, followups: ['查看維修進度', '找服務專員'] };
  }
  if (/你好|哈囉|嗨|hi|hello/i.test(s)) return { text: `${D.customer.call}您好！我是 TOYOTA 智能客服，可以幫您查詢本次維修進度、車況說明與費用，也可以點下方選單。`, followups: ['進度', '費用多少？'] };
  return { text: `我可以協助您查詢本次維修進度、車況說明與費用；其他問題我會轉給 ${D.advisor.name} 專員。`, followups: ['進度', '找服務專員'] };
}

/* ---------- Gemini（REST generateContent） ---------- */
function aiErr(e) {
  const m = String((e && e.message) || e || '');
  if (e && e.name === 'AbortError') return '連線逾時';
  if (e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(m)) return '無法連線（線上展示版不允許外部連線，請用本機 HTML 檔）';
  return m.slice(0, 48);
}
const Gemini = {
  enabled() { return S.ai.mode === 'gemini' && !!(S.ai.key || '').trim(); },
  async call({ system, user, json = true, history = [], images = [], timeout = 25000 }) {
    const key = S.ai.key.trim(), model = (S.ai.model || 'gemini-3.8-flash').trim();
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const contents = history.map(h => ({ role: h.role === 'me' ? 'user' : 'model', parts: [{ text: h.text }] }));
    contents.push({ role: 'user', parts: [{ text: user }, ...images.map(im => ({ inline_data: { mime_type: im.mime, data: im.b64 } }))] });
    const body = { systemInstruction: { parts: [{ text: system }] }, contents, generationConfig: { temperature: 0.3 } };
    if (json) body.generationConfig.responseMimeType = 'application/json';
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl.signal });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
      const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      const text = parts.filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
      if (!text) throw new Error('模型沒有回傳內容');
      return text;
    } finally { clearTimeout(to); }
  },
  parse(text) {
    const t = String(text).replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
    try { return JSON.parse(t); } catch (e) {
      const m = t.match(/\{[\s\S]*\}/);
      if (m) { try { return JSON.parse(m[0]); } catch (e2) { /* fallthrough */ } }
      return null;
    }
  },
};

  const ctx = {

需要說明的項目 id：${findings().map(v => v.id).join(', ')}`;
        const j = Gemini.parse(await Gemini.call({ system, user, images: imgs, timeout: 40000 }));

    return provider;
  },

  async addon(onStep) {
    for (let i = 0; i < ADDON_STEPS.length; i++) { onStep(i); await sleep(fastMode() ? 0 : 420); }
    if (Gemini.enabled() && !fastMode()) {
      try {
        const system = '你是 TOYOTA 服務廠的 AI 車況整理助理。技師在維修中發現新項目，請為車主寫白話說明草稿（之後由專員審核）。繁體中文，不得改數字、不寫價格，語氣客觀、明確說明不處理也可以。只輸出 JSON：{"plain":"一句白話比喻（45 字內）","why":"理由（70 字內）"}';
        const user = '項目：前煞車碟盤表面溝痕。量測：碟盤厚度 25.4 mm（最低使用厚度 24.0 mm），溝痕深約 0.3 mm。情境：正在更換前煞車來令片時發現。可選：本次研磨，或下次保養複查。';
        const j = Gemini.parse(await Gemini.call({ system, user }));
        if (j && (j.plain || j.why)) { AIO.rotor = { plain: j.plain, why: j.why }; return 'gemini'; }
      } catch (e) { toast('Gemini 暫時無法回應，改用離線示範結果'); }
    }
    return 'local';
  },

  async test() {
    const t = await Gemini.call({ system: '你是測試助理。', user: '請只回覆：連線成功', json: false, timeout: 15000 });
    return t.trim().slice(0, 40);
  },
};

const fastMode = () => !!S.fast;
const spd = () => (S.fast ? 0 : 1 / (S.speed || 1));
const wait = ms => sleep(ms * spd());

function toast(text, ms = 2800) {
  const el = $('#toast'); if (!el) return;
  el.textContent = text; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}
function ptoast(text, ms = 1900) {
  const el = $('#ptoast'); if (!el) return;
  el.textContent = text; el.classList.add('show');
  clearTimeout(ptoast._t); ptoast._t = setTimeout(() => el.classList.remove('show'), ms);
}

const STAGES = ['booked', 'reminded', 'arrived', 'inspected', 'confirmed', 'repairing', 'done'];
function stageIdx() { return Math.max(0, STAGES.indexOf(S.stage) - 1); }
function setStage(s) { S.stage = s; }

function oaAvatar() { return '<span class="oa-av"><b>TOYOTA</b></span>'; }

/* ---------------- 時鐘 ---------------- */
function renderClock() {
  $$('.js-clock').forEach(el => { el.textContent = hm(S.now); });
}

/* ---------------- 聊天室 ---------------- */
function pushMsg(m) {
  m.id = ++S.msgSeq; if (m.t == null) m.t = S.now; m.isNew = true;
  S.chat.push(m);
  if (m.from !== 'me' && m.kind === 'flex' && S.footer === 'menu') S.footer = 'closed';
  renderChat(); renderFoot();
  if (m.from !== 'me' && m.kind !== 'sep' && S.liff.length) showBanner(m);
  return m;
}
async function oaPush(m, typing = 700) {
  if (!fastMode() && typing) { S.typing = true; renderChat(); await wait(typing); S.typing = false; }
  return pushMsg({ from: 'oa', ...m });
}

function msgHTML(m) {
  if (m.kind === 'sep') return `<div class="csep"><span>${esc(m.text)}</span></div>`;
  const cls = `msg ${m.from}${m.isNew ? ' enter' : ''}`;
  if (m.from === 'me') return `<div class="${cls}"><div class="mmeta">已讀<br>${hm(m.t)}</div><div class="bub me">${nl2br(m.text)}</div></div>`;
  const av = m.from === 'adv' ? `<div class="av adv">王</div>` : `<div class="av">${oaAvatar()}</div>`;
  const name = m.from === 'adv' ? `<div class="mname">${D.advisor.name}｜服務專員</div>` : '';
  const body = m.kind === 'flex' ? `<div class="fx fx-${m.flex}">${FLEX[m.flex](m.data || {}, m)}</div>` : `<div class="bub">${nl2br(m.text)}</div>`;
  const qr = m.quick ? `<div class="qr">${m.quick.map(q => `<button class="qrb" data-act="say" data-arg="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : '';
  return `<div class="${cls}" data-mid="${m.id}">${av}<div class="mcol">${name}${body}${qr}</div><div class="mmeta">${hm(m.t)}</div></div>`;
}

function renderChat() {
  const el = $('#chatList'); if (!el) return;
  el.innerHTML = S.chat.map(msgHTML).join('') +
    (S.typing ? `<div class="msg oa enter"><div class="av">${oaAvatar()}</div><div class="mcol"><div class="bub typing"><i></i><i></i><i></i></div></div></div>` : '');
  S.chat.forEach(m => { m.isNew = false; });
  el.scrollTop = el.scrollHeight;
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

async function sendChat(text) {
  if (!text) return;
  S.chatDraft = '';
  pushMsg({ from: 'me', kind: 'text', text });
  const r = await AI.ask('general', text);
  if (r.kind === 'progress') { await pushProgressCard(); markStep(11); return; }
  if (r.kind === 'advisor') { requestAdvisor('chat'); return; }
  if (r.kind === 'booking') { await startBookingFlow(true); return; }
  await oaPush({ kind: 'text', text: r.text, quick: r.followups, preview: r.text.slice(0, 30) }, 500);
}

async function pushProgressCard() {
  if (stageIdx() < 4) {
    const msg = stageIdx() >= 2 ? '目前正在等候您確認施作項目，確認後會立即開始維修。' : (stageIdx() >= 1 ? '您的車輛已完成報到，技師正在進行檢查，完成後會立即通知您。' : '目前沒有進行中的維修，可點選「預約回廠」預約保養。');
    await oaPush({ kind: 'text', text: msg, preview: msg.slice(0, 30) }, 500);
    return;
  }
  if (S.stage === 'done') { await oaPush({ kind: 'text', text: `您的愛車已於 ${hm(S.work.doneAt)} 完成，可至 1F 交車區取車。`, preview: '您的愛車已完成' }, 500); return; }
  const pl = plan(), nd = currentNode();
  await oaPush({ kind: 'flex', flex: 'progress', data: { eta: pl.eta, left: Math.max(0, pl.eta - S.now), pct: Math.round(workPct() * 100), node: nd ? nd.label : '' }, preview: '您的車輛目前正在維修中' }, 600);
  act('於 LINE 聊天室查詢維修進度', 'owner');
}

/* ---------------- LIFF ---------------- */
let _liffKey = '';
function openLiff(page, params = {}) {
  S.sheet = null;
  const wasOpen = S.liff.length > 0;
  S.liff.push({ page, params });
  renderLiff(wasOpen ? 'push' : 'open');
}
function liffBack() {
  S.sheet = null;
  S.liff.pop();
  if (!S.liff.length) closeLiff(); else renderLiff('pop');
}
function closeLiff() { S.liff = []; S.sheet = null; S.overlay = null; renderLiff('close'); }
function liffTop() { return S.liff[S.liff.length - 1]; }
function liffIs(page) { const t = liffTop(); return t && t.page === page; }

function renderLiff(mode = 'refresh') {
  const el = $('#liff'); if (!el) return;
  const scr = $('#screen'); if (scr) scr.classList.toggle('liff-on', S.liff.length > 0);
  if (!S.liff.length) { el.classList.remove('open'); _liffKey = ''; setTimeout(() => { if (!S.liff.length) el.innerHTML = ''; }, 320); return; }
  const top = liffTop(), P = PAGES[top.page], params = top.params || {};
  const key = top.page + JSON.stringify(params);
  const oldBody = $('#lbody', el);
  const keep = key === _liffKey && oldBody ? oldBody.scrollTop : 0;
  const multi = S.liff.length > 1;
  el.innerHTML = `<div class="lh">
      <button class="lh-btn" data-act="${multi ? 'liffBack' : 'liffClose'}" aria-label="${multi ? '返回' : '關閉'}">${ic(multi ? 'back' : 'close', 22)}</button>
      <div class="lh-t"><b>${esc(P.title(params))}</b><small>TOYOTA 車況透視鏡</small></div>
      <button class="lh-btn" data-act="liffClose" aria-label="關閉">${multi ? ic('close', 20) : ic('dots', 20)}</button>
    </div>
    <div class="lbody ${mode === 'push' ? 'in' : ''} ${P.bodyClass || ''}" id="lbody">${P.render(params)}</div>
    ${P.foot ? `<div class="lfoot" id="lfoot">${P.foot(params)}</div>` : ''}
    ${sheetHTML()}
    ${S.overlay ? `<div class="lover"><div class="lover-c"><div class="lover-ic">${ic('check', 34)}</div><b>${esc(S.overlay.title)}</b><span>${esc(S.overlay.sub || '')}</span></div></div>` : ''}`;
  el.classList.add('open');
  const nb = $('#lbody', el);
  if (nb && keep) nb.scrollTop = keep;
  _liffKey = key;
  if (P.mount) P.mount(params, mode);
}
function renderLiffFoot() {
  const top = liffTop(); if (!top) return;
  const P = PAGES[top.page], f = $('#lfoot');
  if (P.foot && f) f.innerHTML = P.foot(top.params || {});
}

/* ---------- 量測刻度 ---------- */
function gaugeHTML(g) {
  if (!g) return '';
  if (g.discrete) {
    const i = g.discrete.indexOf(g.cur);
    return `<div class="gauge disc">${g.discrete.map((d, k) => `<div class="gd ${k === i ? 'on' : ''} g${k}"><i></i><span>${d}</span></div>`).join('')}</div>`;
  }
  const pos = v => clamp((v - g.from) / (g.to - g.from), 0, 1) * 100;
  const lp = pos(g.limit);
  const grad = `linear-gradient(90deg, #1E9E5B 0%, #8CC66B ${(lp * .55).toFixed(1)}%, #F2B705 ${(lp * .88).toFixed(1)}%, #E5322D ${lp.toFixed(1)}%, #B42318 100%)`;
  return `<div class="gauge">
      <div class="g-track" style="background:${grad}">
        <div class="g-limit" style="left:${pos(g.limit)}%"></div>
        ${g.extra != null ? `<div class="g-dot alt" style="left:${pos(g.extra)}%"><span>${esc(g.extraLabel)}</span></div>` : ''}
        <div class="g-dot" style="left:${pos(g.cur)}%"><span>${esc(g.curLabel)}</span></div>
      </div>
      <div class="g-lab"><span>${esc(g.fromLabel)}</span><span class="lim" style="left:${pos(g.limit)}%">${esc(g.limitLabel)}</span><span>${esc(g.toLabel)}</span></div>
    </div>`;
}

  progress: {
    title: () => '維修進度',
    render(p) {
      if (stageIdx() < 4) return `<div class="empty">${ic('clock', 30)}<b>確認施作後即會開始維修</b><span>開工後可在這裡看到即時進度與預計完成時間。</span></div>`;
      const pl = plan(), done = S.stage === 'done';
      const pct = workPct(), left = Math.max(0, pl.eta - S.now), n = currentNode();
      const fixed = [
        { t: S.arrivedAt, l: '車輛進廠', s: '完成報到' },
        { t: S.inspectedAt, l: '車輛檢查完成', s: `共發現 ${findings().length} 個建議項目` },
        { t: S.confirm ? S.confirm.t : null, l: '已確認施作項目', s: S.confirm ? `${S.confirm.count} 項，預估 ${hm(S.confirm.eta)} 完成` : '' },
      ];
      const nodes = pl.nodes.map(nd => ({ t: nd.s, l: nd.label, s: `標準工時 ${nd.min} 分鐘`, st: done || S.now >= nd.e ? 'done' : (S.now >= nd.s ? 'cur' : '') }));
      return `<div class="pg-hero ${done ? 'done' : ''}">
          <div class="pg-ring">${ringSVG(pct, 132, 11, done ? '#1E9E5B' : '#1E9E5B', '#E3EAE6')}<div class="pg-rc">${done ? `<small>完成</small><b class="num">${hm(S.work.doneAt)}</b><small>可取車</small>` : `<small>預計</small><b class="num">${hm(pl.eta)}</b><small>完成</small>`}</div></div>
          <div class="pg-t">${done ? `<b>已完成維修</b><span>請至 1F 交車區取車</span>` : `<b>約剩 <span class="num">${left}</span> 分鐘</b><span>${n ? '目前進行：' + esc(n.label) : '準備中'}</span>`}<small>技師 ${D.tech.name}｜工位 ${D.tech.bay}</small></div>
        </div>
        <ol class="tl">
          ${fixed.filter(f => f.t != null).map(f => `<li class="done"><i>${ic('check', 12)}</i><span class="num">${hm(f.t)}</span><div><b>${f.l}</b><small>${esc(f.s)}</small></div></li>`).join('')}
          ${nodes.map(nd => `<li class="${nd.st}"><i>${nd.st === 'done' ? ic('check', 12) : ''}</i><span class="num">${hm(nd.t)}</span><div><b>${esc(nd.l)}</b><small>${nd.st === 'cur' ? '進行中' : esc(nd.s)}</small></div></li>`).join('')}
          <li class="${done ? 'done' : ''} last"><i>${done ? ic('check', 12) : ''}</i><span class="num">${hm(done ? S.work.doneAt : pl.eta)}</span><div><b>${done ? '完工' : '預計完成'}</b><small>${done ? '已通知您取車' : '完成後將以 LINE 通知您'}</small></div></li>
        </ol>
        ${done ? '' : `<section class="free" id="free"><h4 class="sec-t">等候時間，由您安排</h4>
          <button class="swrow" data-act="toggleRemind" aria-pressed="${S.remind}"><span>${ic('bell', 17)}完工前 15 分鐘 LINE 提醒我</span><i class="sw ${S.remind ? 'on' : ''}"></i></button>
          <div class="opts">
            <button class="opt" data-act="openLounge"><span class="oic">${ic('coffee', 18)}</span><b>留在客休室</b><small>線上點飲料｜${D.lounge.seat}</small></button>
            <div class="opt"><span class="oic">${ic('walk', 18)}</span><b>附近走走</b><small>步行 5 分鐘內有咖啡廳與超市</small></div>
            <div class="opt"><span class="oic">${ic('laptop', 18)}</span><b>處理工作</b><small>客休室安靜區有插座與 Wi-Fi</small></div>
          </div>
          <button class="btn ${S.away ? 'ok' : 'ghost'} full" data-act="toggleAway">${S.away ? ic('check', 16) + '已登記暫離，完工前會通知您' : ic('leave', 16) + '我要暫時離開服務廠'}</button>
        </section>`}`;
    },
    mount(p) { if (p && p.anchor === 'free') { const f = $('#free'); if (f) f.scrollIntoView({ block: 'start' }); } },
  },

/* ---------- 打字機效果（AI 回答） ---------- */
function typewrite(el) {
  const full = el.getAttribute('data-full') || '';
  const msgEl = el.closest('.ai-msg');
  const done = () => { el.innerHTML = nl2br(full); if (msgEl) msgEl.classList.remove('typing'); Object.values(S.threads).forEach(th => th.forEach(m => { m.typing = false; })); };
  if (fastMode()) return done();
  let i = 0; el.textContent = '';
  const step = Math.max(1, Math.round(full.length / 70));
  const tick = () => {
    if (!el.isConnected) { Object.values(S.threads).forEach(th => th.forEach(m => { m.typing = false; })); return; }
    i += step; el.innerHTML = nl2br(full.slice(0, i));
    const l = $('#lbody'); if (l) l.scrollTop = l.scrollHeight;
    if (i < full.length) setTimeout(tick, 16 * spd()); else done();
  };
  tick();
}

/* ---------- 簽名板 ---------- */
function mountSig() {
  const c = $('#sigpad'); if (!c) return;
  const w = c.offsetWidth, h = c.offsetHeight;
  c.width = w * 2; c.height = h * 2;
  const ctx = c.getContext('2d');
  ctx.scale(2, 2); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#15181D';
  if (S.sigData) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, w, h); im.src = S.sigData; }
  let drawing = false, last = null;
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * (w / r.width), (e.clientY - r.top) * (h / r.height)]; };
  c.onpointerdown = e => { drawing = true; last = pt(e); c.setPointerCapture(e.pointerId); $('.sig-ph') && $('.sig-ph').classList.add('hide'); };
  c.onpointermove = e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { if (!drawing) return; drawing = false; sigDone(c); };
}
function sigDone(c) {
  S.signed = true; S.sigData = c.toDataURL('image/png');
  renderLiffFoot();
}
async function autoSign() {
  const c = $('#sigpad'); if (!c) return;
  const w = c.offsetWidth, h = c.offsetHeight, ctx = c.getContext('2d');
  $('.sig-ph') && $('.sig-ph').classList.add('hide');
  const strokes = [
    [[.16, .62], [.2, .32], [.24, .66]], [[.12, .45], [.29, .42]], [[.3, .3], [.33, .7]], [[.27, .52], [.38, .5]],
    [[.44, .36], [.47, .7], [.52, .56], [.57, .68], [.6, .34]], [[.66, .5], [.7, .4], [.74, .62], [.79, .44], [.84, .58], [.9, .5]],
  ];
  for (const s of strokes) {
    for (let i = 1; i < s.length; i++) {
      const [x0, y0] = s[i - 1], [x1, y1] = s[i], n = 8;
      for (let k = 1; k <= n; k++) {
        ctx.beginPath();
        ctx.moveTo((x0 + (x1 - x0) * (k - 1) / n) * w, (y0 + (y1 - y0) * (k - 1) / n) * h);
        ctx.lineTo((x0 + (x1 - x0) * k / n) * w, (y0 + (y1 - y0) * k / n) * h);
        ctx.stroke();
        if (!fastMode()) await sleep(9 * spd());
      }
    }
  }
  sigDone(c);
}

async function askAI(key, q) {
  if (!q || S.aiBusy) return;
  S.aiDraft = '';
  atLeast('14:15');
  const th = S.threads[key] = S.threads[key] || [];
  th.push({ role: 'me', text: q, t: S.now });
  S.metrics.aiQ++;
  act(`詢問 AI（${key === 'general' ? '整體' : itemView(key).short}）：${q}`, 'ai');
  S.aiBusy = true; renderLiff();
  const r = await AI.ask(key, q, th.slice(0, -1));
  S.aiBusy = false;
  const idx = th.length;
  th.push({ role: 'ai', text: r.text || '', sources: r.sources || ['本次工單'], handoff: r.handoff, followups: r.followups || [], provider: r.provider, typing: true, t: S.now });
  if (r.handoff && (r.intent === 'safety' || r.intent === 'warranty')) {
    S.handoffs.unshift({ t: S.now, from: 'ai', status: 'open', q, key, idx });
    S.metrics.handoff++;
    act(`AI 判定需轉真人：「${q}」`, 'warn');
  }
  if (liffIs('ai')) renderLiff(); else if (S.liff.length) renderLiff();
  markStep(7);
}
